name: Update Rozetka Feed

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: rozetka-feed-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install requests

      - name: Generate Rozetka XML
        run: python script.py

      - name: Validate generated Rozetka XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path('rozetka_clean.xml')
          if not path.is_file():
              raise RuntimeError('rozetka_clean.xml was not created')
          size = path.stat().st_size
          if size < 1_000_000:
              raise RuntimeError(
                  f'Rozetka feed is unexpectedly small: {size}'
              )
          offers = 0
          for _, elem in ET.iterparse(path, events=('end',)):
              if elem.tag == 'offer':
                  offers += 1
              elem.clear()
          if offers < 1_000:
              raise RuntimeError(
                  f'Rozetka feed has too few offers: {offers}'
              )
          print('Rozetka XML validation passed')
          print('Bytes:', size)
          print('Offers:', offers)
          PY

      - name: Commit and push updated Rozetka feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f rozetka_clean.xml
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update rozetka_clean.xml feed"
            git push origin HEAD:main
            echo "Rozetka feed committed to repository."
          else
            echo "No changes in rozetka_clean.xml to commit."
          fi
