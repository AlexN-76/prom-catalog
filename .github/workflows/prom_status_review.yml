name: Prom Supplier Status Review

on:
  workflow_run:
    workflows: ["Merge Suppliers Feeds"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: prom-supplier-status-review
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current catalog and observer state
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact generation report
        uses: actions/download-artifact@v4
        with:
          name: prom-import-reports
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/prom-status-audit

      - name: Check generation identity and decide whether API read is needed
        id: decision
        env:
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          REPORT_DIR: ${{ runner.temp }}/prom-status-audit
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads(Path('supplier_absence_state.json').read_text(encoding='utf-8'))
          report = json.loads((Path(os.environ['REPORT_DIR']) / 'supplier_absence_report.json').read_text(encoding='utf-8'))
          expected = str(os.environ['EXPECTED_RUN_ID'])
          assert str(report.get('run_id')) == expected, 'wrong run report'
          assert report.get('mode') == 'READ_ONLY_DRY_RUN', 'wrong observer mode'
          assert report.get('no_prom_api_calls') is True, 'unexpected observer report'
          assert not report.get('skipped'), 'observer skipped generation'
          # If a newer generation has already committed its state, do not process stale reports.
          current = str(state.get('last_processed_workflow_run_id')) == expected
          current &= expected in set(map(str, state.get('processed_generation_ids', [])))
          current &= state.get('last_processed_workflow_run_number') == report.get('run_number')
          count = report.get('candidate_review_only')
          assert type(count) is int and count >= 0, 'invalid candidate count'
          assert isinstance(report.get('candidates_for_manual_review'), list), 'missing candidate list'
          assert len(report['candidates_for_manual_review']) == count, 'candidate count mismatch'
          needed = current and count > 0
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"has_candidates={'true' if needed else 'false'}\n")
          print('Generation matches committed state:', current)
          print('Candidates reported:', count)
          print('Prom API read required:', needed)
          PY

      - name: Fetch current Prom.ua snapshot (GET only)
        if: steps.decision.outputs.has_candidates == 'true'
        env:
          PROM_API_TOKEN: ${{ secrets.PROM_API_TOKEN }}
          REPORT_DIR: ${{ runner.temp }}/prom-status-audit
        run: |
          test -n "$PROM_API_TOKEN" || { echo 'PROM_API_TOKEN is missing'; exit 1; }
          python3 prom_live_api_readonly.py --full --min-expected 11000 \
            --output "$REPORT_DIR/prom_snapshot.csv"

      - name: Recover protected manual list privately
        if: steps.decision.outputs.has_candidates == 'true'
        env:
          PROM_PROTECTED_59_B64: ${{ secrets.PROM_PROTECTED_59_B64 }}
          REPORT_DIR: ${{ runner.temp }}/prom-status-audit
        run: |
          python3 - <<'PY'
          import base64, csv, io, os
          from pathlib import Path
          payload = os.environ.get('PROM_PROTECTED_59_B64', '')
          assert payload, 'PROM_PROTECTED_59_B64 is missing'
          raw = base64.b64decode(payload, validate=True)
          assert len(raw) < 48000, 'unreasonable protected list size'
          rows = list(csv.DictReader(io.StringIO(raw.decode('utf-8-sig')), delimiter=';'))
          assert len(rows) == 59, 'protected registry must contain exactly 59 rows'
          assert all(r.get('protect', '').strip().upper() == 'YES' for r in rows), 'bad protection flag'
          ids = [r.get('prom_internal_id', '').strip() for r in rows]
          assert len(set(ids)) == 59 and all(v.isdigit() for v in ids), 'bad internal IDs'
          p = Path(os.environ['REPORT_DIR']) / 'manual_protected.csv'
          p.write_bytes(raw)
          p.chmod(0o600)
          print('Private protection registry: 59 entries validated')
          PY

      - name: Prepare candidate review (no status changes)
        if: steps.decision.outputs.has_candidates == 'true'
        env:
          REPORT_DIR: ${{ runner.temp }}/prom-status-audit
        run: |
          python3 prom_hide_review_plan.py \
            --state supplier_absence_state.json \
            --report "$REPORT_DIR/supplier_absence_report.json" \
            --feed merged_prom_catalog.xml \
            --snapshot "$REPORT_DIR/prom_snapshot.csv" \
            --protected "$REPORT_DIR/manual_protected.csv" \
            --baseline prom_existing_products_safe.csv \
            --output "$REPORT_DIR/review_only.csv" \
            --snapshot-max-age-hours 6
          echo 'Review generated privately. No data uploaded, no POST/PATCH/DELETE requests.'

      - name: Confirm no auto-write path was enabled
        run: |
          echo 'READ-ONLY: this workflow never executes prom_one_hide.py.'
          echo 'No Prom.ua product statuses were changed by this workflow.'
