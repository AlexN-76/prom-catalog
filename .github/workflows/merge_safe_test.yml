name: Safe XML Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check existing catalog
        run: |
          test -s merged_prom_catalog.xml

      - name: Run safe generator
        run: |
          python3 merge_suppliers_safe.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prom-safe-test-results
          path: |
            merged_prom_catalog_test.xml
            merge_exclusions_test.csv
            merge_summary_test.json
          retention-days: 3
          if-no-files-found: warn
