
name: Merge Suppliers Feeds

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prom-catalog-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch last published XML backup from Pages
        env:
          PUBLISHED_FEED_URL: https://alexn-76.github.io/prom-catalog/merged_prom_catalog.xml
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          url = os.environ['PUBLISHED_FEED_URL']
          target = Path('merged_prom_catalog.xml')
          temp = Path('merged_prom_catalog.xml.download')

          state = json.loads(
              Path('supplier_absence_state.json').read_text(
                  encoding='utf-8-sig'
              )
          )
          expected_sha = str(
              state.get('published_feed_sha256') or ''
          ).strip().lower()

          last_error = None
          for attempt in range(1, 5):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          'User-Agent': 'prom-catalog-backup/1.0',
                          'Cache-Control': 'no-cache',
                      },
                  )
                  h = hashlib.sha256()
                  size = 0
                  with urllib.request.urlopen(
                      req, timeout=180
                  ) as response, temp.open('wb') as f:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          f.write(chunk)
                          h.update(chunk)
                          size += len(chunk)

                  actual_sha = h.hexdigest()
                  if size < 1_000_000:
                      raise RuntimeError(
                          f'Published feed is unexpectedly small: {size}'
                      )

                  offers = 0
                  for _, elem in ET.iterparse(
                      temp, events=('end',)
                  ):
                      if elem.tag == 'offer':
                          offers += 1
                      elem.clear()

                  if offers < 10_000:
                      raise RuntimeError(
                          f'Published feed has too few offers: {offers}'
                      )

                  if expected_sha and actual_sha != expected_sha:
                      raise RuntimeError(
                          'Pages feed SHA-256 does not match '
                          'the last committed state: '
                          f'{actual_sha} != {expected_sha}'
                      )

                  temp.replace(target)
                  print('Pages backup verified')
                  print('Bytes:', size)
                  print('Offers:', offers)
                  print('SHA256:', actual_sha)
                  if not expected_sha:
                      print(
                          'Transition run: no previous SHA in state; '
                          'structural validation used.'
                      )
                  break
              except Exception as exc:
                  last_error = exc
                  temp.unlink(missing_ok=True)
                  if attempt == 4:
                      raise
                  print(
                      f'Attempt {attempt}/4 failed: {exc}. '
                      'Retrying in 15 seconds...'
                  )
                  time.sleep(15)
          else:
              raise RuntimeError(str(last_error))
          PY

      - name: Check backup and database
        run: |
          test -s merged_prom_catalog.xml
          test -s prom_existing_products_safe.csv
          test -s merge_suppliers_safe.py
          test -s supplier_absence_observer.py
          test -s supplier_absence_state.json

      - name: Generate safe XML
        run: |
          python merge_suppliers_safe.py

      - name: Validate generated catalog
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          with open("merge_summary_test.json", encoding="utf-8") as f:
              report = json.load(f)

          root = ET.parse("merged_prom_catalog_test.xml").getroot()
          offers = root.findall("./shop/offers/offer")
          ids = [o.get("id") for o in offers]

          assert len(offers) > 0, "Empty catalog"
          assert len(ids) == len(set(ids)), "Duplicate offer IDs"
          assert len(offers) == report["output_offers"], "Count mismatch"

          print("XML validation passed")
          print("Offers:", len(offers))
          print("Excluded:", report["excluded"])
          PY
      
      - name: Apply approved Prom categories
        run: |
          python3 add_prom_categories_hybrid.py \
            --input merged_prom_catalog_test.xml \
            --output merged_prom_catalog_categorized.xml \
            --mapping prom_category_mapping.csv \
            --reference prom_reference_categories.csv \
            --overrides prom_product_category_overrides.csv \
            --review category_review.csv \
            --report category_report.json

      - name: Verify and activate categorized XML
        run: |
          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET

          original = ET.parse(
              "merged_prom_catalog_test.xml"
          ).getroot()
          categorized = ET.parse(
              "merged_prom_catalog_categorized.xml"
          ).getroot()

          def normalize(element):
              attrs = tuple(sorted(
                  (k, v) for k, v in element.attrib.items()
                  if not (
                      element.tag == "category"
                      and k == "portal_id"
                  )
              ))
              children = tuple(
                  normalize(child)
                  for child in element
                  if child.tag != "portal_category_id"
              )
              value = element.text or ""
              if not value.strip():
                  value = ""
              return element.tag, attrs, value, children

          for section, tag in (
              ("categories", "category"),
              ("offers", "offer")
          ):
              before = original.findall(
                  f"./shop/{section}/{tag}"
              )
              after = categorized.findall(
                  f"./shop/{section}/{tag}"
              )
              assert len(before) == len(after), section

              for a, b in zip(before, after):
                  assert normalize(a) == normalize(b), (
                      f"Unexpected change: {a.get('id')}"
                  )

              print(f"{section}: {len(before)} OK")

          with open(
              "category_report.json", encoding="utf-8"
          ) as f:
              report = json.load(f)

          counts = report["counts"]
          unmapped = counts.get("unmapped", 0)

          print("Category statistics:", counts)

          if unmapped:
              print(
                  "WARNING:",
                  unmapped,
                  "products have no mapped Prom category. "
                  "They will still be published; Prom may "
                  "determine their marketplace category."
              )

          os.replace(
              "merged_prom_catalog_categorized.xml",
              "merged_prom_catalog_test.xml"
          )

          print("CATEGORIZED XML VERIFIED")
          PY
      - name: Apply 1282 reviewed Prom categories
        run: |
          python3 apply_reviewed_category_decisions.py \
            --input merged_prom_catalog_test.xml \
            --output merged_prom_catalog_reviewed.xml \
            --decisions prom_reviewed_category_decisions_1282.csv \
            --reference prom_reference_categories.csv \
            --extra-categories prom_reviewed_extra_categories.csv \
            --report prom_reviewed_category_report.json

      - name: Verify reviewed categories and activate XML
        run: |
          python3 validate_prom_category_diff.py \
            --input merged_prom_catalog_test.xml \
            --output merged_prom_catalog_reviewed.xml
          python3 verify_reviewed_preview.py \
            --xml merged_prom_catalog_reviewed.xml \
            --decisions prom_reviewed_category_decisions_1282.csv \
            --report prom_reviewed_verification.json
          mv merged_prom_catalog_reviewed.xml merged_prom_catalog_test.xml    
    

      # State is only proposed here. No Prom API writes; on failure there is
      # no deployment and no state commit. Each supplier is evaluated only
      # when its source is fresh and all final-XML checks have passed.
      - name: Observe supplier absences (dry-run only)
        env:
          OBS_RUN_ID: ${{ github.run_id }}
          OBS_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 supplier_absence_observer.py \
            --run-id "$OBS_RUN_ID" \
            --run-number "$OBS_RUN_NUMBER" \
            --state supplier_absence_state.json \
            --summary merge_summary_test.json \
            --observations supplier_observations_test.json \
            --feed merged_prom_catalog_test.xml \
            --output-state supplier_absence_next_state.json \
            --report supplier_absence_report.json

      - name: Bind observer state to exact published XML
        env:
          OBS_RUN_ID: ${{ github.run_id }}
          OBS_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          feed = Path('merged_prom_catalog_test.xml')
          state_path = Path('supplier_absence_next_state.json')
          report_path = Path('supplier_absence_report.json')

          state = json.loads(
              state_path.read_text(encoding='utf-8-sig')
          )
          report = json.loads(
              report_path.read_text(encoding='utf-8-sig')
          )

          run_id = str(os.environ['OBS_RUN_ID'])
          run_number = int(os.environ['OBS_RUN_NUMBER'])

          assert str(state.get('last_processed_workflow_run_id')) == run_id
          assert state.get('last_processed_workflow_run_number') == run_number
          assert str(report.get('run_id')) == run_id
          assert report.get('run_number') == run_number
          assert report.get('skipped') is False

          sha = hashlib.sha256()
          size = 0
          with feed.open('rb') as f:
              while True:
                  chunk = f.read(1024 * 1024)
                  if not chunk:
                      break
                  sha.update(chunk)
                  size += len(chunk)
          digest = sha.hexdigest()

          offers = 0
          for _, elem in ET.iterparse(feed, events=('end',)):
              if elem.tag == 'offer':
                  offers += 1
              elem.clear()

          assert offers >= 10_000, offers

          state['published_feed_sha256'] = digest
          state['published_feed_size_bytes'] = size
          state['published_feed_offer_count'] = offers
          state['published_feed_workflow_run_id'] = run_id
          state['published_feed_workflow_run_number'] = run_number

          report['published_feed_sha256'] = digest
          report['published_feed_size_bytes'] = size
          report['published_feed_offer_count'] = offers

          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          report_path.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          print('Published XML identity recorded')
          print('Bytes:', size)
          print('Offers:', offers)
          print('SHA256:', digest)
          PY

      - name: Fetch current Rozetka feed for joint Pages deployment
        env:
          ROZETKA_PAGES_URL: https://alexn-76.github.io/prom-catalog/rozetka_clean.xml
        run: |
          python3 - <<'PY'
          import os
          import time
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          url = os.environ['ROZETKA_PAGES_URL']
          target = Path('rozetka_for_pages.xml')
          temp = Path('rozetka_for_pages.xml.download')
          fallback = Path('rozetka_clean.xml')

          def validate(path):
              size = path.stat().st_size

              if size < 1_000_000:
                  raise RuntimeError(
                      f'Rozetka feed unexpectedly small: {size}'
                  )

              offers = 0
              for _, elem in ET.iterparse(
                  path, events=('end',)
              ):
                  if elem.tag == 'offer':
                      offers += 1
                  elem.clear()

              if offers < 1_000:
                  raise RuntimeError(
                      f'Rozetka feed has too few offers: {offers}'
                  )

              return size, offers

          last_error = None

          for attempt in range(1, 5):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          'User-Agent': 'prom-pages-bridge/1.0',
                          'Cache-Control': 'no-cache',
                      },
                  )

                  with urllib.request.urlopen(
                      req, timeout=180
                  ) as response, temp.open('wb') as f:
                      while True:
                          chunk = response.read(1024 * 1024)
                          if not chunk:
                              break
                          f.write(chunk)

                  size, offers = validate(temp)
                  temp.replace(target)

                  print('Rozetka Pages feed preserved')
                  print('Bytes:', size)
                  print('Offers:', offers)
                  break

              except Exception as exc:
                  last_error = exc
                  temp.unlink(missing_ok=True)

                  if attempt < 4:
                      print(
                          f'Attempt {attempt}/4 failed: {exc}. '
                          'Retrying in 15 seconds...'
                      )
                      time.sleep(15)
                      continue

                  # One-time transition fallback. The repository still
                  # contains the last tracked rozetka_clean.xml.
                  if fallback.is_file():
                      size, offers = validate(fallback)
                      target.write_bytes(fallback.read_bytes())

                      print(
                          'Pages Rozetka feed unavailable; '
                          'using tracked transition fallback'
                      )
                      print('Bytes:', size)
                      print('Offers:', offers)
                      break

                  raise RuntimeError(
                      'No valid Rozetka feed available from Pages '
                      f'or repository: {last_error}'
                  )
          PY

      - name: Prepare website
        run: |
          mkdir -p _site
          cp merged_prom_catalog_test.xml \
            _site/merged_prom_catalog.xml
          cp rozetka_for_pages.xml \
            _site/rozetka_clean.xml
          echo '<!doctype html><title>Marketplace Feeds</title>' \
            > _site/index.html
          test -s _site/merged_prom_catalog.xml
          test -s _site/rozetka_clean.xml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save published observer state
        run: |
          test -s supplier_absence_next_state.json
          mv supplier_absence_next_state.json supplier_absence_state.json
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"
          git add supplier_absence_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update supplier observation state"
            git push origin HEAD:main
          fi

      - name: Save diagnostic reports
        uses: actions/upload-artifact@v4
        with:
          name: prom-import-reports
          path: |
            merge_summary_test.json
            merge_exclusions_test.csv
            supplier_absence_report.json
          retention-days: 14
