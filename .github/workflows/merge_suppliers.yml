name: Merge Suppliers Feeds

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prom-catalog-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check database and scripts
        run: |
          test -s prom_existing_products_safe.csv
          test -s merge_suppliers_safe.py
          test -s supplier_absence_observer.py
          test -s supplier_absence_state.json
      - name: Create dummy catalog fallback if missing
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          for name in ['merged_prom_catalog.xml', 'merged_prom_catalog_test.xml']:
              p = Path(name)
              if not p.is_file():
                  p.write_text('<?xml version="1.0" encoding="UTF-8"?><yml_catalog date="2026-11-06"><shop><name>Init</name><offers></offers></shop></yml_catalog>', encoding='utf-8')
          print("Fallback XMLs checked/created.")
          EOF
      - name: Generate safe XML
        run: |
          python merge_suppliers_safe.py
      - name: Validate generated catalog
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          with open("merge_summary_test.json", encoding="utf-8") as f:
              report = json.load(f)
          root = ET.parse("merged_prom_catalog_test.xml").getroot()
          offers = root.findall("./shop/offers/offer")
          ids = [o.get("id") for o in offers]
          assert len(offers) > 0, "Empty catalog"
          assert len(ids) == len(set(ids)), "Duplicate offer IDs"
          assert len(offers) == report["output_offers"], "Count mismatch"
          print("XML validation passed")
          print("Offers:", len(offers))
          print("Excluded:", report["excluded"])
          PY
      - name: Apply approved Prom categories
        run: |
          python3 add_prom_categories_hybrid.py \
            --input merged_prom_catalog_test.xml \
            --output merged_prom_catalog_categorized.xml \
            --mapping prom_category_mapping.csv \
            --reference prom_reference_categories.csv \
            --overrides prom_product_category_overrides.csv \
            --review category_review.csv \
            --report category_report.json
      - name: Verify and activate categorized XML
        run: |
          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          original = ET.parse(
              "merged_prom_catalog_test.xml"
          ).getroot()
          categorized = ET.parse(
              "merged_prom_catalog_categorized.xml"
          ).getroot()
          def normalize(element):
              attrs = tuple(sorted(
                  (k, v) for k, v in element.attrib.items()
                  if not (
                      element.tag == "category"
                      and k == "portal_id"
                  )
              ))
              children = tuple(
                  normalize(child)
                  for child in element
                  if child.tag != "portal_category_id"
              )
              value = element.text or ""
              if not value.strip():
                  value = ""
              return element.tag, attrs, value, children
          for section, tag in (
              ("categories", "category"),
              ("offers", "offer")
          ):
              before = original.findall(
                  f"./shop/{section}/{tag}"
              )
              after = categorized.findall(
                  f"./shop/{section}/{tag}"
              )
              assert len(before) == len(after), section
              for a, b in zip(before, after):
                  assert normalize(a) == normalize(b), (
                      f"Unexpected change: {a.get('id')}"
                  )
              print(f"{section}: {len(before)} OK")
          with open(
              "category_report.json", encoding="utf-8"
          ) as f:
              report = json.load(f)
          counts = report["counts"]
          unmapped = counts.get("unmapped", 0)
          print("Category statistics:", counts)
          if unmapped:
              print(
                  "WARNING:",
                  unmapped,
                  "products have no mapped Prom category."
              )
          os.replace(
              "merged_prom_catalog_categorized.xml",
              "merged_prom_catalog_test.xml"
          )
          print("CATEGORIZED XML VERIFIED")
          PY
      - name: Apply 1282 reviewed Prom categories
        run: |
          python3 apply_reviewed_category_decisions.py \
            --input merged_prom_catalog_test.xml \
            --output merged_prom_catalog_reviewed.xml \
            --decisions prom_reviewed_category_decisions_1282.csv \
            --reference prom_reference_categories.csv \
            --extra-categories prom_reviewed_extra_categories.csv \
            --report prom_reviewed_category_report.json
      - name: Verify reviewed categories and activate XML
        run: |
          python3 validate_prom_category_diff.py \
            --input merged_prom_catalog_test.xml \
            --output merged_prom_catalog_reviewed.xml
          python3 verify_reviewed_preview.py \
            --xml merged_prom_catalog_reviewed.xml \
            --decisions prom_reviewed_category_decisions_1282.csv \
            --report prom_reviewed_verification.json
          mv merged_prom_catalog_reviewed.xml merged_prom_catalog_test.xml
      - name: Observe supplier absences (dry-run only)
        env:
          OBS_RUN_ID: ${{ github.run_id }}
          OBS_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 supplier_absence_observer.py \
            --run-id "$OBS_RUN_ID" \
            --run-number "$OBS_RUN_NUMBER" \
            --state supplier_absence_state.json \
            --summary merge_summary_test.json \
            --observations supplier_observations_test.json \
            --feed merged_prom_catalog_test.xml \
            --output-state supplier_absence_next_state.json \
            --report supplier_absence_report.json
      - name: Bind observer state to exact published XML
        env:
          OBS_RUN_ID: ${{ github.run_id }}
          OBS_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          feed = Path('merged_prom_catalog_test.xml')
          state_path = Path('supplier_absence_next_state.json')
          report_path = Path('supplier_absence_report.json')
          state = json.loads(
              state_path.read_text(encoding='utf-8-sig')
          )
          report = json.loads(
              report_path.read_text(encoding='utf-8-sig')
          )
          run_id = str(os.environ['OBS_RUN_ID'])
          run_number = int(os.environ['OBS_RUN_NUMBER'])
          assert str(state.get('last_processed_workflow_run_id')) == run_id
          assert state.get('last_processed_workflow_run_number') == run_number
          assert str(report.get('run_id')) == run_id
          assert report.get('run_number') == run_number
          assert report.get('skipped') is False
          sha = hashlib.sha256()
          size = 0
          with feed.open('rb') as f:
              while True:
                  chunk = f.read(1024 * 1024)
                  if not chunk:
                      break
                  sha.update(chunk)
                  size += len(chunk)
          digest = sha.hexdigest()
          offers = 0
          for _, elem in ET.iterparse(feed, events=('end',)):
              if elem.tag == 'offer':
                  offers += 1
              elem.clear()
          assert offers >= 10_000, offers
          state['published_feed_sha256'] = digest
          state['published_feed_size_bytes'] = size
          state['published_feed_offer_count'] = offers
          state['published_feed_workflow_run_id'] = run_id
          state['published_feed_workflow_run_number'] = run_number
          report['published_feed_sha256'] = digest
          report['published_feed_size_bytes'] = size
          report['published_feed_offer_count'] = offers
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          report_path.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          print('Published XML identity recorded')
          print('Bytes:', size)
          print('Offers:', offers)
          print('SHA256:', digest)
          PY
      - name: Commit and push merged catalog and observer state
        run: |
          cp merged_prom_catalog_test.xml merged_prom_catalog.xml
          test -s supplier_absence_next_state.json
          mv supplier_absence_next_state.json supplier_absence_state.json
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f merged_prom_catalog.xml supplier_absence_state.json
          
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update merged Prom catalog and observer state"
            git push origin HEAD:main
            echo "Merged catalog and observer state successfully committed."
          else
            echo "No changes in merged catalog or state to commit."
          fi
      - name: Save diagnostic reports
        uses: actions/upload-artifact@v4
        with:
          name: prom-import-reports
          path: |
            merge_summary_test.json
            merge_exclusions_test.csv
            supplier_absence_report.json
          retention-days: 14
