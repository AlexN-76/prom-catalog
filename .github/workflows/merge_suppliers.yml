
name: Merge Suppliers Feeds

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prom-catalog-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check backup and database
        run: |
          test -s merged_prom_catalog.xml
          test -s prom_existing_products_safe.csv
          test -s merge_suppliers_safe.py

      - name: Generate safe XML
        run: |
          python merge_suppliers_safe.py

      - name: Validate generated catalog
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          with open("merge_summary_test.json", encoding="utf-8") as f:
              report = json.load(f)

          root = ET.parse("merged_prom_catalog_test.xml").getroot()
          offers = root.findall("./shop/offers/offer")
          ids = [o.get("id") for o in offers]

          assert len(offers) > 0, "Empty catalog"
          assert len(ids) == len(set(ids)), "Duplicate offer IDs"
          assert len(offers) == report["output_offers"], "Count mismatch"

          print("XML validation passed")
          print("Offers:", len(offers))
          print("Excluded:", report["excluded"])
          PY
      
      - name: Apply approved Prom categories
        run: |
          python3 add_prom_categories_hybrid.py \
            --input merged_prom_catalog_test.xml \
            --output merged_prom_catalog_categorized.xml \
            --mapping prom_category_mapping.csv \
            --reference prom_reference_categories.csv \
            --overrides prom_product_category_overrides.csv \
            --review category_review.csv \
            --report category_report.json

      - name: Verify and activate categorized XML
        run: |
          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET

          original = ET.parse(
              "merged_prom_catalog_test.xml"
          ).getroot()
          categorized = ET.parse(
              "merged_prom_catalog_categorized.xml"
          ).getroot()

          def normalize(element):
              attrs = tuple(sorted(
                  (k, v) for k, v in element.attrib.items()
                  if not (
                      element.tag == "category"
                      and k == "portal_id"
                  )
              ))
              children = tuple(
                  normalize(child)
                  for child in element
                  if child.tag != "portal_category_id"
              )
              value = element.text or ""
              if not value.strip():
                  value = ""
              return element.tag, attrs, value, children

          for section, tag in (
              ("categories", "category"),
              ("offers", "offer")
          ):
              before = original.findall(
                  f"./shop/{section}/{tag}"
              )
              after = categorized.findall(
                  f"./shop/{section}/{tag}"
              )
              assert len(before) == len(after), section

              for a, b in zip(before, after):
                  assert normalize(a) == normalize(b), (
                      f"Unexpected change: {a.get('id')}"
                  )

              print(f"{section}: {len(before)} OK")

          with open(
              "category_report.json", encoding="utf-8"
          ) as f:
              report = json.load(f)

          counts = report["counts"]
          assert counts.get("unmapped", 0) == 0, (
              "Unmapped supplier categories"
          )

          print("Category statistics:", counts)

          os.replace(
              "merged_prom_catalog_categorized.xml",
              "merged_prom_catalog_test.xml"
          )

          print("CATEGORIZED XML VERIFIED")
          PY
    

      - name: Prepare website
        run: |
          mkdir -p _site
          cp merged_prom_catalog_test.xml \
            _site/merged_prom_catalog.xml
          echo '<!doctype html><title>Prom Catalog</title>' \
            > _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save published XML as backup
        run: |
          cp merged_prom_catalog_test.xml merged_prom_catalog.xml
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"
          git add merged_prom_catalog.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update safe suppliers catalog"
            git push origin HEAD:main
          fi

      - name: Save diagnostic reports
        uses: actions/upload-artifact@v4
        with:
          name: prom-import-reports
          path: |
            merge_summary_test.json
            merge_exclusions_test.csv
          retention-days: 14
